{% extends "base.html" %}
{% block title %}Löschen · Mathe-Trainer{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>{{ person.display_name }} wirklich löschen?</h1>
  <p>Der Fortschritt von {{ person.display_name }} geht dabei mit verloren.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="danger" type="submit">Ja, löschen</button>
  </form>
  <p><a href="{{ url_for('admin') }}">Nein, zurück</a></p>
</section>
{% endblock %}
